name: Build and Deploy GitBook

# 本仓库是《2030处理器设计》的可读 Markdown 副本。LaTeX 源不在此公开，
# 因此 CI 不需要 TeXLive / pandoc / TikZ 编译——Markdown 已经随仓库入库，
# 只把 VitePress 站点打包并部署到 GitHub Pages 即可。
#
# 本工作流不使用任何来自 issue/PR 标题、body、评论等不可信输入，
# 故不存在 Actions Injection 风险。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        run: pnpm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload artifact (PR preview only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
